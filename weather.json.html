</style><style type="text/css" data-vite-dev-id="C:/Users/ritik/Weather Application/Weather App/src/App.css">* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: Arial, Helvetica, sans-serif;
}

.app {
  min-height: 100vh;
  padding: 30px 15px;
  background: linear-gradient(135deg, #4facfe, #00f2fe);
  display: flex;
  justify-content: center;
}

.weather-container {
  width: 100%;
  max-width: 950px;
}

header {
  text-align: center;
  color: white;
  margin-bottom: 25px;
}

header h1 {
  font-size: 42px;
  font-weight: 800;
  letter-spacing: -1px;
}

header h1 span {
  color: #fff200;
}

header p {
  margin-top: 7px;
  opacity: 0.9;
}

.search-box {
  display: flex;
  gap: 10px;
  margin-bottom: 25px;
}

.search-box input {
  flex: 1;
  padding: 17px 20px;
  border: none;
  outline: none;
  border-radius: 15px;
  font-size: 16px;
  background: rgba(255, 255, 255, 0.95);
}

.search-box button {
  padding: 0 25px;
  border: none;
  border-radius: 15px;
  background: #111827;
  color: white;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: 0.3s;
}

.search-box button:hover {
  transform: translateY(-2px);
  background: #000;
}

.main-card {
  padding: 30px;
  border-radius: 28px;
  color: white;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(18px);
  border: 1px solid rgba(255, 255, 255, 0.3);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
}

.location {
  font-size: 18px;
  font-weight: 600;
}

.weather-main {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 30px;
  margin: 25px 0;
}

.weather-icon {
  font-size: 100px;
}

.weather-main h2 {
  font-size: 90px;
  line-height: 1;
}

.condition {
  font-size: 21px;
  text-transform: capitalize;
  margin: 8px 0;
}

.details {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 15px;
}

.detail {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
  border-radius: 18px;
  background: rgba(255, 255, 255, 0.15);
}

.detail span {
  font-size: 28px;
}

.detail small {
  display: block;
  opacity: 0.8;
  margin-bottom: 4px;
}

.detail strong {
  font-size: 15px;
}

.forecast {
  margin-top: 25px;
}

.forecast h3 {
  color: white;
  font-size: 22px;
  margin-bottom: 15px;
}

.forecast-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 12px;
}

.forecast-card {
  padding: 20px 10px;
  text-align: center;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.85);
  color: #111827;
  transition: 0.3s;
}

.forecast-card:hover {
  transform: translateY(-5px);
}

.forecast-card p {
  font-weight: 700;
}

.forecast-icon {
  font-size: 40px;
  margin: 15px 0;
}

.forecast-card h4 {
  font-size: 28px;
}

.forecast-card span {
  display: block;
  margin-top: 5px;
  font-size: 13px;
  text-transform: capitalize;
  color: #555;
}

.welcome {
  text-align: center;
  padding: 80px 20px;
  color: white;
}

.welcome div {
  font-size: 80px;
  margin-bottom: 15px;
}

.welcome h2 {
  font-size: 30px;
  margin-bottom: 10px;
}

.loading,
.error {
  text-align: center;
  padding: 20px;
  border-radius: 15px;
  background: rgba(255, 255, 255, 0.9);
  margin-bottom: 20px;
}

.error {
  color: #dc2626;
}

/* Mobile */

@media (max-width: 700px) {
  .app {
    padding: 20px 12px;
  }

  header h1 {
    font-size: 34px;
  }

  .search-box {
    flex-direction: column;
  }

  .search-box button {
    height: 52px;
  }

  .main-card {
    padding: 22px 15px;
  }

  .weather-main {
    gap: 15px;
  }

  .weather-icon {
    font-size: 70px;
  }

  .weather-main h2 {
    font-size: 65px;
  }

  .condition {
    font-size: 17px;
  }

  .details {
    grid-template-columns: repeat(2, 1fr);
  }

  .forecast-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .forecast-card:last-child {
    display: none;
  }
}

@media (max-width: 400px) {
  .details {
    grid-template-columns: 1fr;
  }

  .weather-main h2 {
    font-size: 55px;
  }

  .weather-icon {
    font-size: 60px;
  }
}
.search-wrapper {
  position: relative;
  flex: 1;
}

.search-wrapper input {
  width: 100%;
}

.suggestions {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;

  background: white;
  border-radius: 16px;

  overflow: hidden;
  z-index: 1000;

  box-shadow: 0 12px 35px rgba(0, 0, 0, 0.18);
}

.suggestion-item {
  display: flex;
  align-items: center;
  gap: 12px;

  padding: 14px 16px;

  cursor: pointer;
  color: #111827;

  transition: 0.2s;
}

.suggestion-item:hover {
  background: #f1f5f9;
}

.pin {
  font-size: 20px;
}

.suggestion-item strong {
  display: block;
  font-size: 15px;
}

.suggestion-item small {
  display: block;
  margin-top: 3px;
  color: #64748b;
  font-size: 12px;
}
</style></head>

    <div id="root"><div class="app"><div class="weather-container"><header><h1>Weather<span>Now</span></h1><p>Know your weather, plan your day.</p></header><div class="search-box"><div class="search-wrapper"><input placeholder="Search Indian city..." type="text" value=""></div><button>🔍 Search</button></div><div class="welcome"><div>🌤️</div><h2>Check the weather</h2><p>Enter a city name to get current weather information.</p></div></div></div></div>
