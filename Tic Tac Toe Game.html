<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>games</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background-color: #548687;
        text-align: center;
      }
      .container {
        height: 70vh;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 1.5vmin;
      }
      .game {
        height: 60vmin;
        width: 60vmin;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: center;
        gap: 1.5vmin;
      }
      .box {
        height: 18vmin;
        width: 18vmin;
        border-radius: 8px;
        border: none;
        box-shadow: 0 0 5px rgb(0, 0, 0.3);
        font-size: 60px;
        font-weight: 800;
        background-color: lightpink;
        color: black;
      }
      .game :hover {
        background-color: lightcoral;
      }
      #reset {
        padding: 10px;
        font-size: 16px;
        background-color: white;
        font-weight: 700;
        border: 1px solid black;
        border-radius: 10px;
        box-shadow: 0 0 5px black;
        margin-bottom: 10px;
      }

      #reset:hover {
        background-color: black;
        color: white;
      }
      #new-game {
        padding: 10px;
        font-size: 16px;
        background-color: white;
        font-weight: 700;
        border: 1px solid black;
        border-radius: 10px;
        box-shadow: 0 0 5px black;
        margin-left: 10px;
        margin-bottom: 10px;
      }

      #new-game:hover {
        background-color: black;
        color: white;
      }
      #msg {
        color: color-mix(in srgb, red 30%, rgb(107, 30, 195) 30%);
        font-size: 40px;
        font-weight: 800;
        transition: cubic-bezier(0.23, 1, 0.32, 1);
        animation: forwards;
        animation-duration: 9ms;
      }
      .heading {
        font-size: 70px;
        margin-top: 12px;
      }
      .hide {
        display: none;
      }
      @media (max-width: 600px) {
        .game {
          height: 90vmin;
          width: 90vmin;
          gap: 2vmin;
        }
        .box {
          height: 28vmin;
          width: 28vmin;
          font-size: 40px;
        }
        .heading {
          font-size: 40px;
        }
        #msg {
          font-size: 25px;
        }
      }
    </style>
  </head>
  <body>
    <div class="msg-container hide">
      <p id="msg">Winner</p>
    </div>
    <main>
      <h1 class="heading">Tic Tac Toe</h1>
      <div class="container">
        <div class="game">
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>

          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
        </div>
      </div>
      <button id="reset">Reset Game</button>
      <button id="new-game">new Game</button>
    </main>
    <script>
      let btn = document.querySelectorAll(".box");
      let resets = document.querySelector("#reset");
      let newgame = document.querySelector("#new-game");
      let msgcontainer = document.querySelector(".msg-container");
      let msg = document.querySelector("#msg");
      let turnO = true;

      const winpattern = [
        [0, 1, 2],
        [3, 4, 5],
        [1, 4, 7],
        [0, 4, 8],
        [6, 7, 8],
        [0, 3, 6],
        [2, 5, 8],
        [2, 4, 6],
      ];
      const resetgame = () => {
        turnO = true;
        enablebox();
        msgcontainer.classList.add("hide");
      };
      btn.forEach((box) => {
        box.addEventListener("click", () => {
          if (turnO) {
            box.innerText = "O";
            turnO = false;
          } else {
            box.innerText = "X";
            turnO = true;
          }
          box.disabled = true;
          checkwinner();
        });
      });
      const disablebox = () => {
        for (let box of btn) {
          box.disabled = true;
        }
      };
      const enablebox = () => {
        for (let box of btn) {
          box.disabled = false;
          box.innerText = "";
        }
      };
      const showwinner = (winner) => {
        msg.innerText = `congratulation, winner is ${winner}`;
        msgcontainer.classList.remove("hide");
        disablebox();
      };

      const checkwinner = () => {
        for (let patten of winpattern) {
          let posi1val = btn[patten[0]].innerText;
          let posi2val = btn[patten[1]].innerText;
          let posi3val = btn[patten[2]].innerText;

          if (posi1val != "" && posi2val != "" && posi3val != "") {
            if (posi1val == posi2val && posi2val == posi3val) {
              showwinner(posi1val);
            }
          }
        }
      };
      newgame.addEventListener("click", resetgame);
      resets.addEventListener("click", resetgame);
    </script>
  </body>
</html>
